<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>WebAR ArUco Hybrid</title>
  <style>
    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:transparent!important;
    }
    #unity-container{
      position:fixed;
      inset:0;
      z-index:2;
      background:transparent!important;
      pointer-events:none;
    }
    #unity-canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      background:transparent!important;
      pointer-events:none;
    }
    #loading{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      color:#fff;
      font-family:Arial,sans-serif;
      z-index:20;
      text-align:center;
      background:rgba(0,0,0,.65);
      padding:14px 18px;
      border-radius:10px;
      min-width:280px;
    }
    #progress{
      width:280px;
      height:8px;
      background:#333;
      border-radius:4px;
      overflow:hidden;
      margin-top:12px;
    }
    #bar{
      width:0;
      height:100%;
      background:#fff;
    }
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div id="loading-text">Loading WebAR ArUco...</div>
    <div id="progress"><div id="bar"></div></div>
  </div>
</div>

<!-- OpenCV.js is loaded independently of the Unity WebGL build. -->
<script>
  var Module = {
    onRuntimeInitialized: function(){
      window.__opencvReady = true;
      console.log('[ArUco] OpenCV runtime ready');
    }
  };
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
  var canvas = document.querySelector('#unity-canvas');
  var loading = document.querySelector('#loading');
  var loadingText = document.querySelector('#loading-text');
  var bar = document.querySelector('#bar');
  var buildUrl = 'Build';

  // IMPORTANT:
  // Use Unity's template variables instead of hard-coded build filenames.
  // Unity replaces these macros during WebGL build generation.
  var config = {
    dataUrl: buildUrl + '/Webbb1.data.unityweb',
    frameworkUrl: buildUrl + '/Webbb1.framework.js.unityweb',
    codeUrl: buildUrl + '/Webbb1.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'AR Demo',
    productName: 'WebAR ArUco Hybrid',
    productVersion: '1.0',
    webglContextAttributes: {
      preserveDrawingBuffer: true,
      powerPreference: 2
    }
  };

  var loaderUrl = buildUrl + '/Webbb1.loader.js';
  var script = document.createElement('script');
  script.src = loaderUrl;

  script.onload = function(){
    console.log('[ArUco] Unity loader loaded:', loaderUrl);
    createUnityInstance(canvas, config, function(progress){
      bar.style.width = (100 * progress) + '%';
    }, function(message){
      console.error('[ArUco] Unity loading error:', message);
      loadingText.textContent = 'Unity error: ' + message;
    }).then(function(){
      console.log('[ArUco] Unity initialized');
      loading.style.display = 'none';
    }).catch(function(e){
      console.error('[ArUco] Unity startup error:', e);
      loadingText.textContent = 'Unity error: ' + e;
    });
  };

  script.onerror = function(){
    console.error('[ArUco] Failed to load Unity loader:', loaderUrl);
    loadingText.textContent = 'Failed to load Unity WebGL build.';
  };

  document.body.appendChild(script);
</script>
</body>
</html>
